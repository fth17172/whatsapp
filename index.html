<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emirhan İletişim Hatı</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. GİRİŞ EKRANI (Sadece Siz Seçersiniz) -->
    <div id="login-screen" class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl shadow-2xl text-center border border-slate-700">
        <h1 class="text-xl font-bold mb-2 text-amber-400">Emirhan ile Mesajlaşma</h1>
        <p class="text-xs text-slate-400 mb-6">Bu cihazı kim kullanıyor?</p>
        <div class="space-y-3">
            <button onclick="login('anne')" class="w-full bg-pink-600 hover:bg-pink-700 py-3.5 rounded-xl font-semibold transition">Arzu</button>
            <button onclick="login('baba')" class="w-full bg-blue-600 hover:bg-blue-700 py-3.5 rounded-xl font-semibold transition">Hasan</button>
            <button onclick="login('fatih')" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3.5 rounded-xl font-semibold transition">Fatih</button>
            <div class="pt-2 border-t border-slate-700">
                <button onclick="login('emirhan')" class="w-full bg-amber-600 hover:bg-amber-700 py-3.5 rounded-xl font-bold transition">Emirhan</button>
            </div>
        </div>
    </div>

    <!-- 2. MESAJLAŞMA EKRANI (Doğrudan Emirhan Bağlantısı) -->
    <div id="chat-screen" class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 flex flex-col h-[520px] hidden">
        
        <!-- Üst Başlık -->
        <div class="bg-slate-700 p-4 rounded-t-2xl flex justify-between items-center border-b border-slate-600">
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Aktif Sohbet</p>
                <h2 id="chat-target-title" class="font-bold text-base text-amber-400">Emirhan</h2>
            </div>
            <span id="status-badge" class="text-xs bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full font-semibold">Çevrimdışı</span>
        </div>

        <!-- Mesaj Kutusu -->
        <div id="messages-box" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col bg-slate-900/50">
            <p class="text-center text-xs text-slate-500 my-2">Bağlantı kurulduğunda mesaj atabilirsiniz.</p>
        </div>

        <!-- Mesaj Gönderme Alanı -->
        <div class="p-3 bg-slate-700 rounded-b-2xl flex gap-2 border-t border-slate-600">
            <input id="message-input" type="text" placeholder="Mesaj yazın..." class="flex-1 bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500 text-white">
            <button onclick="sendMessage()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-xl text-sm transition">Gönder</button>
        </div>
    </div>

    <script>
        const ID_MAP = {
            emirhan: "aile-emirhan-id-99",
            anne: "aile-anne-id-99",
            baba: "aile-baba-id-99",
            fatih: "aile-fatih-id-99"
        };

        let peer = null;
        let conn = null;
        let myRole = "";

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        function login(role) {
            myRole = role;
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("chat-screen").classList.remove("hidden");

            peer = new Peer(ID_MAP[role]);

            peer.on('open', () => {
                if (myRole === 'emirhan') {
                    document.getElementById("chat-target-title").innerText = "Aile Bağlantı Hattı";
                } else {
                    document.getElementById("chat-target-title").innerText = "Emirhan";
                    // Sen, Annem veya Babam girdiğinde otomatik Emirhan'a bağlanmaya çalışır
                    connectToEmirhan();
                }
            });

            // Gelen bağlantıları dinle (Emirhan bağlandığında)
            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnection();
            });
        }

        function connectToEmirhan() {
            conn = peer.connect(ID_MAP['emirhan']);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                const badge = document.getElementById("status-badge");
                badge.innerText = "Çevrimiçi";
                badge.className = "text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-semibold";
            });

            conn.on('data', (data) => {
                appendMessage(data.senderName, data.text, 'incoming');
                playNotificationSound();
            });

            conn.on('close', () => {
                const badge = document.getElementById("status-badge");
                badge.innerText = "Çevrimdışı";
                badge.className = "text-xs bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full font-semibold";
            });
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text || !conn) return;

            const senderLabel = myRole.toUpperCase();
            const payload = { senderName: senderLabel, text: text };
            
            conn.send(payload);
            appendMessage("Ben", text, 'outgoing');
            input.value = "";
        }

        function appendMessage(sender, text, type) {
            const box = document.getElementById("messages-box");
            const msgDiv = document.createElement("div");
            
            if (type === 'outgoing') {
                msgDiv.className = "self-end bg-amber-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-none text-sm max-w-[80%] shadow";
                msgDiv.innerText = text;
            } else {
                msgDiv.className = "self-start bg-slate-700 text-white px-3.5 py-2 rounded-2xl rounded-tl-none text-sm max-w-[80%] shadow";
                msgDiv.innerHTML = `<span class="text-[10px] block text-amber-400 font-bold mb-0.5">${sender}</span>${text}`;
            }
            
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function playNotificationSound() {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Emirhan İletişim", {
                    body: "Yeni bir mesaj geldi!",
                    icon: "https://cdn-icons-png.flaticon.com/512/3059/3059502.png"
                });
            }
        }
    </script>
</body>
</html>
