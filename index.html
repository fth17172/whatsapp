<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aile İletişim Ağım</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS P2P Ses Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. GİRİŞ EKRANI -->
    <div id="login-screen" class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl shadow-2xl text-center border border-slate-700">
        <h1 class="text-xl font-bold mb-2 text-slate-100">Cihaz Sahibi Seçimi</h1>
        <p class="text-xs text-slate-400 mb-6">Lütfen bu cihazın sahibini seçin</p>
        <div class="space-y-3">
            <button onclick="login('kardes')" class="w-full bg-amber-600 hover:bg-amber-700 py-3.5 rounded-xl font-semibold transition active:scale-95 shadow-lg">Ben Kardeşim</button>
            <button onclick="login('anne')" class="w-full bg-pink-600 hover:bg-pink-700 py-3.5 rounded-xl font-semibold transition active:scale-95 shadow-lg">Ben Annem</button>
            <button onclick="login('baba')" class="w-full bg-blue-600 hover:bg-blue-700 py-3.5 rounded-xl font-semibold transition active:scale-95 shadow-lg">Ben Babam</button>
            <button onclick="login('fatih')" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3.5 rounded-xl font-semibold transition active:scale-95 shadow-lg">Ben Fatih</button>
        </div>
    </div>

    <!-- 2. KONTROL PANELİ -->
    <div id="app-screen" class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 hidden">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <p class="text-xs text-slate-400">Aktif Profil</p>
                <h2 id="user-title" class="text-lg font-bold text-emerald-400"></h2>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs text-emerald-400 font-medium">Çevrimiçi</span>
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            </div>
        </div>

        <!-- Bildirim İzni Butonu -->
        <div id="notif-perm-box" class="mb-6 bg-slate-700/50 p-3 rounded-xl border border-slate-600 hidden">
            <p class="text-xs text-slate-300 mb-2">Kapalıyken bildirim ("tınnn") almak için izin ver:</p>
            <button onclick="requestNotificationPermission()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded-lg text-xs font-bold transition">Bildirim Sesi İznini Aç</button>
        </div>

        <div id="contact-zone">
            <!-- Kişiler Rol Bazlı Buraya Yüklenecek -->
        </div>
    </div>

    <!-- 3. ARAMA VE SES EKRANI -->
    <div id="call-screen" class="fixed inset-0 bg-slate-950/95 flex flex-col items-center justify-center hidden z-50 p-4">
        <div class="w-24 h-24 bg-emerald-500/20 rounded-full flex items-center justify-center mb-6 animate-bounce border border-emerald-500/40">
            <svg class="w-12 h-12 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        </div>
        <p id="call-status" class="text-xl font-semibold mb-8 text-center">Bağlanıyor...</p>
        <button onclick="endCall()" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3.5 rounded-full font-bold shadow-xl transition active:scale-95">Aramayı Kapat</button>
        <audio id="remote-audio" autoplay></audio>
    </div>

    <script>
        // Sabit PeerJS Kimlikleri
        const ID_MAP = {
            kardes: "aile-kardes-id-99",
            anne: "aile-anne-id-99",
            baba: "aile-baba-id-99",
            fatih: "aile-fatih-id-99"
        };

        let peer = null;
        let activeCall = null;
        let myRole = "";

        // Service Worker Kaydı (Bildirim Sesi ve Arka Plan İçin Şart)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker Kayıt Edildi:', reg))
                .catch(err => console.log('SW Hata:', err));
        }

        function login(role) {
            myRole = role;
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("app-screen").classList.remove("hidden");
            document.getElementById("user-title").innerText = role.toUpperCase();

            // P2P Sunucusuna Bağlantı
            peer = new Peer(ID_MAP[role]);

            // Gelen Aramayı Yakalama
            peer.on('call', async (call) => {
                if (confirm("Gelen Sesli Arama Var! Açmak istiyor musun?")) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        call.answer(stream);
                        handleCall(call);
                    } catch (e) {
                        alert("Mikrofon izni verilmedi!");
                    }
                }
            });

            checkNotificationPermission();
            renderDashboard();
        }

        function checkNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                document.getElementById("notif-perm-box").classList.remove("hidden");
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        document.getElementById("notif-perm-box").classList.add("hidden");
                        alert("Bildirim sesleri aktif edildi!");
                    }
                });
            }
        }

        function renderDashboard() {
            const container = document.getElementById("contact-zone");
            container.innerHTML = "";

            if (myRole === "kardes") {
                // Kardeşin Ekranı: Herkesi görür ve arar
                container.innerHTML = `
                    <p class="text-xs font-semibold text-slate-400 uppercase mb-3">Aranacak Kişiler</p>
                    <div class="space-y-3">
                        <button onclick="startCall('anne')" class="w-full flex justify-between items-center bg-slate-700 p-4 rounded-xl font-medium hover:bg-slate-600 transition">
                            <span>Annem</span> <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg font-bold">Ara</span>
                        </button>
                        <button onclick="startCall('baba')" class="w-full flex justify-between items-center bg-slate-700 p-4 rounded-xl font-medium hover:bg-slate-600 transition">
                            <span>Babam</span> <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg font-bold">Ara</span>
                        </button>
                        <button onclick="startCall('fatih')" class="w-full flex justify-between items-center bg-slate-700 p-4 rounded-xl font-medium hover:bg-slate-600 transition">
                            <span>Fatih</span> <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg font-bold">Ara</span>
                        </button>
                    </div>
                `;
            } else {
                // Anne, Baba ve Fatih Ekranı: Sadece Kardeşi Arar
                container.innerHTML = `
                    <p class="text-xs font-semibold text-slate-400 uppercase mb-3">Hızlı Bağlantı</p>
                    <button onclick="startCall('kardes')" class="w-full bg-amber-600 hover:bg-amber-700 p-4 rounded-xl font-bold flex items-center justify-center space-x-2 transition shadow-lg active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        <span>Kardeşimi Ara</span>
                    </button>
                `;
            }
        }

        async function startCall(targetRole) {
            document.getElementById("call-screen").classList.remove("hidden");
            document.getElementById("call-status").innerText = targetRole.toUpperCase() + " Aranıyor...";

            // Arka planda bildirim sesini tetikleme (Push Trigger)
            triggerPushNotification(targetRole);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const call = peer.call(ID_MAP[targetRole], stream);
                handleCall(call);
            } catch (err) {
                alert("Mikrofon izni verin!");
                endCall();
            }
        }

        function triggerPushNotification(targetRole) {
            // Push notification servisi bağlandığında burası API isteği atacak
            console.log(targetRole + " için arka plan bildirim sesi tetiklendi.");
        }

        function handleCall(call) {
            activeCall = call;
            call.on('stream', (remoteStream) => {
                document.getElementById("remote-audio").srcObject = remoteStream;
                document.getElementById("call-status").innerText = "Görüşme Devam Ediyor...";
            });
            call.on('close', endCall);
            call.on('error', endCall);
        }

        function endCall() {
            if (activeCall) activeCall.close();
            document.getElementById("call-screen").classList.add("hidden");
        }
    </script>
</body>
</html>
